plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.rotalucro.app'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.rotalucro.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-beta'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
