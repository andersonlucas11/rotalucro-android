name: RotaLucro 0.5 - Editar Corridas
on:
  workflow_dispatch:
  push:
    paths:
      - 'edit05/**'
      - '.github/workflows/rotalucro-05.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extrair projeto e aplicar edicao
        run: |
          mkdir projeto
          unzip -q RotaLucro-v0.3-PROJETO.zip -d projeto
          cp edit05/MainActivity.java edit05/RideStore.java projeto/app/src/main/java/br/com/rotalucro/app/
          sed -i "s/versionCode 3/versionCode 5/g; s/versionName '0.3-financas'/versionName '0.5-edicao'/g" projeto/app/build.gradle
          grep -q 'updateCompleted' projeto/app/src/main/java/br/com/rotalucro/app/RideStore.java
          grep -q 'Editar corrida' projeto/app/src/main/java/br/com/rotalucro/app/MainActivity.java
      - name: Compilar APK
        working-directory: projeto
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RotaLucro-0.5-Edicao-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
