name: Gerar RotaLucro Seguro

on:
  workflow_dispatch:
  push:
    paths:
      - 'RotaLucro-Seguro-v0.2-fonte.zip'
      - '.github/workflows/seguro.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Descompactar codigo seguro
        run: unzip -q 'RotaLucro-Seguro-v0.2-fonte.zip' -d projeto

      - name: Conferir ausencia do servico de acessibilidade
        run: |
          test ! -e projeto/app/src/main/java/br/com/rotalucro/app/RideAccessibilityService.java
          test ! -e projeto/app/src/main/res/xml/accessibility_service_config.xml
          ! grep -q 'BIND_ACCESSIBILITY_SERVICE' projeto/app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.INTERNET' projeto/app/src/main/AndroidManifest.xml

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar SDK Android
        uses: android-actions/setup-android@v4

      - name: Instalar SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar versao segura
        working-directory: projeto
        run: gradle --no-daemon assembleDebug

      - name: Entregar APK seguro
        uses: actions/upload-artifact@v4
        with:
          name: RotaLucro-Seguro-v0.2-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
